:root[data-fp="night"]{--bg:#0a1630;--surface:#11203e;--surface2:#192b50;--ink:#e9eef9;--muted:#a4b2cd;--line:#293c66;--brand:#4fcd6e;--brand-ink:#7ee096;--navy:#a7c0f2;--gold:#e8c766;--on-brand:#06210d;--good:#4fcd6e;--warn:#f0a34a;--bad:#ff8a80;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--rail:#081126;--rail-ink:#e9eef9;--rail-muted:#9aa9c8;--rail-line:#1e2f55;--rail-act:#e8c766;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-fp]){--bg:#0a1630;--surface:#11203e;--surface2:#192b50;--ink:#e9eef9;--muted:#a4b2cd;--line:#293c66;--brand:#4fcd6e;--brand-ink:#7ee096;--navy:#a7c0f2;--gold:#e8c766;--on-brand:#06210d;--good:#4fcd6e;--warn:#f0a34a;--bad:#ff8a80;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--rail:#081126;--rail-ink:#e9eef9;--rail-muted:#9aa9c8;--rail-line:#1e2f55;--rail-act:#e8c766;color-scheme:dark}}
:root[data-theme="dark"]:not([data-fp]){--bg:#0a1630;--surface:#11203e;--surface2:#192b50;--ink:#e9eef9;--muted:#a4b2cd;--line:#293c66;--brand:#4fcd6e;--brand-ink:#7ee096;--navy:#a7c0f2;--gold:#e8c766;--on-brand:#06210d;--good:#4fcd6e;--warn:#f0a34a;--bad:#ff8a80;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--rail:#081126;--rail-ink:#e9eef9;--rail-muted:#9aa9c8;--rail-line:#1e2f55;--rail-act:#e8c766;color-scheme:dark}
:root[data-fp="dark"]{--bg:#0d0f0e;--surface:#161a17;--surface2:#1f2521;--ink:#e9ede9;--muted:#9ba59e;--line:#2c342f;--brand:#52cf70;--brand-ink:#7fe096;--navy:#9bb6ec;--gold:#e3c05a;--on-brand:#06210d;--good:#52cf70;--warn:#f0a34a;--bad:#ff8a80;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--rail:#090b0a;--rail-ink:#e9ede9;--rail-muted:#8f9a92;--rail-line:#232a26;--rail-act:#e3c05a;color-scheme:dark}
:root[data-fp="white"]{--bg:#ffffff;--surface:#ffffff;--surface2:#f2f4f6;--ink:#111827;--muted:#4b5563;--line:#dde2e8;--brand:#157a35;--brand-ink:#0e5f28;--navy:#1f3864;--gold:#9a6b00;--on-brand:#ffffff;--shadow:0 0 0 1px #e6eaef,0 6px 18px rgba(17,24,39,.05);--rail:#f6f8fa;--rail-ink:#111827;--rail-muted:#5b6675;--rail-line:#dde2e8;--rail-act:#157a35;color-scheme:light}
:root[data-fp="lemon"]{--bg:#eaf5bd;--surface:#fbffe8;--surface2:#dcec9f;--ink:#1b2a0b;--muted:#4c5e2a;--line:#bfd774;--brand:#2a8a1c;--brand-ink:#1d6a12;--navy:#1f3864;--gold:#836600;--on-brand:#ffffff;--shadow:0 1px 2px rgba(60,80,10,.1),0 8px 22px rgba(60,80,10,.12);--rail:#24480f;--rail-ink:#f3fbd9;--rail-muted:#c4dc8c;--rail-line:#3b6620;--rail-act:#e9f36b;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16.5px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,h5{font-family:var(--font-display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0 0 .85em}
a{color:var(--brand-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.num,table td.n{font-variant-numeric:tabular-nums}
.sr{position:absolute;left:-9999px}
svg.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}

#app{display:grid;grid-template-columns:292px 1fr;height:100%}
#side{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rail-line)}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#view{flex:1;overflow:auto;min-height:0;scroll-behavior:smooth}
.wrap{max-width:1180px;margin:0 auto;padding:22px clamp(16px,3vw,34px) 48px}
.read{max-width:78ch}

/* brand rail */
.brand{display:flex;gap:12px;align-items:center;padding:16px 16px 12px;border-bottom:1px solid var(--rail-line)}
.brand .bt{font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1.15;letter-spacing:.01em}
.brand .bt small{display:block;font-weight:500;font-size:11.5px;color:var(--rail-muted);letter-spacing:.04em;margin-top:3px}
.coin{--s:54px;width:var(--s);height:var(--s);perspective:600px;flex:none;position:relative}
.coin .spin{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:coin 9s cubic-bezier(.6,.05,.3,1) infinite}
.coin .face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;background:#fff center/78% no-repeat;box-shadow:inset 0 0 0 2px #e8c766,0 2px 10px rgba(0,0,0,.35)}
.coin .back{transform:rotateY(180deg)}
.coin::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--rail-act) 70%,transparent);animation:orbit 16s linear infinite}
.coin.big{--s:132px}.coin.big::after{inset:-12px;border-color:color-mix(in srgb,var(--gold) 70%,transparent)}
.coin.big::before{content:"";position:absolute;inset:-22px;border-radius:50%;border:1px solid color-mix(in srgb,var(--brand) 45%,transparent);animation:pulse 3.6s ease-out infinite}
@keyframes coin{0%,38%{transform:rotateY(0)}50%,88%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(.86);opacity:.9}100%{transform:scale(1.18);opacity:0}}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav a,.tree summary,.tree a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--rail-ink);text-decoration:none;font-size:14.5px;line-height:1.3}
.nav a:hover,.tree a:hover,.tree summary:hover{background:color-mix(in srgb,var(--rail-ink) 9%,transparent)}
.nav a.on,.tree a.on{background:color-mix(in srgb,var(--rail-act) 18%,transparent);color:var(--rail-act);font-weight:600}
.side-h{font:600 11px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted);padding:14px 18px 6px}
.tree{overflow:auto;flex:1;min-height:0;padding:0 8px 12px}
.tree details{border-radius:8px}
.tree summary{cursor:pointer;list-style:none;font-weight:600;font-size:13.5px}
.tree summary::-webkit-details-marker{display:none}
.tree summary .pn{font:700 10.5px/1 var(--font-mono);color:var(--rail-act);min-width:24px}
.tree summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--rail-muted);border-bottom:2px solid var(--rail-muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.tree details[open]>summary::after{transform:rotate(45deg)}
.tree a{font-size:13px;padding:6px 10px 6px 14px;color:var(--rail-muted);align-items:flex-start}
.tree a .cn{font:600 11px/1.5 var(--font-mono);min-width:20px;color:var(--rail-ink)}
.tree a .dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;border:1.5px solid var(--rail-muted)}
.tree a .dot.done{background:var(--rail-act);border-color:var(--rail-act)}
.side-f{padding:10px 16px 14px;border-top:1px solid var(--rail-line);font-size:11.5px;color:var(--rail-muted);line-height:1.45}

/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:8px clamp(12px,2vw,22px);background:var(--surface);border-bottom:1px solid var(--line);min-height:58px;flex-wrap:wrap}
#top .crumb{font:600 14px/1.2 var(--font-display);color:var(--muted);min-width:0;flex:1 1 140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:13.5px;font-weight:600;line-height:1}
.ib:hover{border-color:var(--brand);color:var(--brand-ink)}
.ib.on{background:color-mix(in srgb,var(--brand) 14%,var(--surface));border-color:var(--brand);color:var(--brand-ink)}
#menuBtn{display:none}
.search{position:relative;flex:1 1 180px;max-width:300px}
.search input[type=search]{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:7px 10px 7px 34px;font-size:14px}
.search svg{position:absolute;left:9px;top:9px;color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40;max-height:60vh;overflow:auto;padding:6px}
.results a{display:block;padding:7px 9px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.35}
.results a:hover,.results a.sel{background:var(--surface2)}
.results a small{display:block;color:var(--muted)}
.clockbar{display:flex;align-items:center;gap:9px;padding:3px 10px 3px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface2)}
.clockbar .dg{font:600 14px/1.1 var(--font-mono);letter-spacing:.02em}
.clockbar .dt{font-size:10.5px;color:var(--muted);line-height:1.1;white-space:nowrap}
.aclock{display:block}
.pop{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;width:min(330px,92vw)}
.pop h5{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.themes button{border:2px solid var(--line);border-radius:10px;padding:0;background:none;overflow:hidden;font-size:11px;font-weight:600}
.themes button i{display:block;height:34px}
.themes button span{display:block;padding:4px 2px}
.themes button.on{border-color:var(--brand)}
.switch{position:relative;width:44px;height:24px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.18s}
.switch[aria-checked="true"]{background:var(--brand);border-color:var(--brand)}
.switch[aria-checked="true"]::after{left:22px;background:#fff}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.tracks{display:flex;flex-direction:column;gap:3px;max-height:230px;overflow:auto;margin:8px 0}
.tracks button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;font-size:13.5px}
.tracks button small{color:var(--muted)}
.tracks button.on{background:color-mix(in srgb,var(--brand) 13%,var(--surface));border-color:var(--brand)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:var(--brand);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.paused .eq i{animation-play-state:paused}

/* generic */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);border-radius:9px;padding:9px 15px;font-weight:700;font-size:14.5px;line-height:1.1;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--brand-ink)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.eyebrow{font:700 11.5px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;line-height:1.4}
button.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.sec-title{font-size:21px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));border-radius:99px;transition:width .5s}
input[type=text],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select{font-weight:500;color:var(--ink);font-size:15px}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;background:linear-gradient(120deg,color-mix(in srgb,var(--navy) 92%,#000),color-mix(in srgb,var(--navy) 70%,var(--brand)));color:#fff;border-radius:18px;padding:26px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:340px;height:340px;border-radius:50%;border:1px solid rgba(232,199,102,.35);box-shadow:0 0 0 40px rgba(232,199,102,.06),0 0 0 90px rgba(232,199,102,.04);pointer-events:none}
.hero h1{font-size:clamp(23px,3.1vw,35px);font-weight:800;letter-spacing:-.01em}
.hero .sub{color:#d9e3f6;margin:8px 0 12px;font-size:16px;max-width:60ch}
.hero .who{font-weight:700;color:#e8c766}
.hero .creds{font:500 12px/1.5 var(--font-mono);color:#c8d5ee}
.hero .tag{font-style:italic;color:#e8c766;margin-top:10px}
.bigclock{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1}
.bigclock .dg{font:700 24px/1 var(--font-mono);letter-spacing:.04em}
.bigclock .dt{font-size:12.5px;color:#d9e3f6}
.stat{padding:14px 16px}
.stat b{display:block;font:800 28px/1 var(--font-display);color:var(--navy)}
.stat span{font-size:13px;color:var(--muted)}
.partcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s}
.partcard:hover{transform:translateY(-2px);border-color:var(--brand)}
.partcard .pn{font:700 11.5px/1 var(--font-mono);color:var(--gold);letter-spacing:.08em}
.partcard h3{font-size:16.5px}
.partcard p{font-size:13.5px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.teaser{border-left:5px solid var(--gold);background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 12%,var(--surface)),var(--surface))}
.teaser h3{font-size:19px;margin:4px 0 8px}

/* chapter */
.chead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.chead .no{font:800 46px/1 var(--font-display);color:var(--gold);min-width:64px}
.chead h1{font-size:clamp(21px,2.6vw,29px);font-weight:800}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin:0 0 18px;padding-bottom:0;position:sticky;top:0;background:var(--bg);z-index:20;scrollbar-width:thin}
.tabs a{white-space:nowrap;padding:10px 12px;font:600 14px/1 var(--font-display);color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0;display:inline-flex;gap:6px;align-items:center}
.tabs a:hover{color:var(--ink);background:var(--surface2)}
.tabs a.on{color:var(--brand-ink);border-bottom-color:var(--brand);background:var(--surface)}
.tabs a .ct{font:600 10.5px/1 var(--font-mono);background:var(--surface2);border-radius:99px;padding:3px 6px;color:var(--muted)}
.prose{font-size:17px}
.prose h4.sub{font-size:17.5px;margin:22px 0 8px;color:var(--navy)}
.prose ul,.prose ol{margin:0 0 .9em;padding-left:1.35em}
.prose li{margin:.25em 0}
.prose ol.mk{list-style:none;padding-left:0}
.prose ol.mk>li{display:grid;grid-template-columns:2.4em 1fr;gap:2px}
.prose ol.mk>li.l1{margin-left:2em}
.prose ol.mk>li>span.m{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.prose ul li.l1{margin-left:1.4em;list-style:circle}
.prose p.c{text-align:center}
.tw{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tw table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.4}
.tw caption{caption-side:top;text-align:left;font:700 13.5px/1.35 var(--font-display);padding:9px 12px;color:var(--navy);background:var(--surface2);border-bottom:1px solid var(--line)}
.tw th,.tw td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.tw th{background:var(--navy);color:var(--surface);font-weight:700;font-size:13.5px}
:root[data-fp="night"] .tw th,:root[data-fp="dark"] .tw th{background:color-mix(in srgb,var(--navy) 26%,var(--surface));color:var(--ink)}
.tw td.n,.tw th.n{text-align:right;white-space:nowrap}
.tw tr:last-child td{border-bottom:0}
.tw tbody tr:hover td{background:color-mix(in srgb,var(--brand) 6%,transparent)}
figure.fig{margin:14px 0 18px;text-align:center}
figure.fig img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in;padding:6px}
figure.fig figcaption{font:600 13.5px/1.4 var(--font-display);color:var(--muted);margin-top:6px}
.box{--k:var(--navy);border:1px solid color-mix(in srgb,var(--k) 35%,var(--line));border-left:5px solid var(--k);background:color-mix(in srgb,var(--k) 7%,var(--surface));border-radius:10px;padding:12px 16px;margin:14px 0}
.box>.bh{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.box .bk{font:800 11px/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--k) 72%,var(--ink))}
.box .bt{font:700 16px/1.3 var(--font-display)}
.box>:last-child{margin-bottom:0}
.k-we{--k:#b8860b}.k-def{--k:#2f5597}.k-kf{--k:#475569}.k-ng{--k:#1b8a3a}.k-pit{--k:#c0392b}.k-tip{--k:#d97706}.k-eth{--k:#7a55b5}.k-men{--k:#3b63b0}.k-pra{--k:#0e7c86}.k-tec{--k:#0e7490}.k-esg{--k:#4d7c0f}.k-new{--k:#b45309}.k-case{--k:#8b5a2b}.k-note{--k:#64748b}.k-ice{--k:#b8860b}
.insight{display:flex;width:100%;text-align:left;gap:12px;align-items:center;border:1px dashed color-mix(in srgb,var(--k) 60%,var(--line));background:color-mix(in srgb,var(--k) 8%,var(--surface));border-radius:10px;padding:10px 14px;margin:12px 0;transition:transform .12s}
.insight:hover{transform:translateX(3px);border-style:solid}
.insight .io{width:34px;height:34px;border-radius:50%;background:var(--k);color:#fff;display:grid;place-items:center;flex:none}
.insight .bk{font:800 10.5px/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--k) 72%,var(--ink));display:block}
.insight .bt{font:700 15px/1.3 var(--font-display)}
.insight .go{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
details.sol{margin-top:10px;border-top:1px dashed color-mix(in srgb,var(--k,var(--navy)) 45%,var(--line));padding-top:8px}
details.sol>summary{cursor:pointer;font-weight:700;color:var(--brand-ink);list-style:none;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--brand);border-radius:8px;padding:6px 12px;font-size:14px}
details.sol>summary::-webkit-details-marker{display:none}
details.sol[open]>summary{margin-bottom:10px;background:var(--brand);color:var(--on-brand)}
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px;overflow:clip}
details.acc>summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:center;padding:13px 16px;font:700 17px/1.3 var(--font-display)}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .sn{font:700 12.5px/1 var(--font-mono);color:var(--gold);min-width:42px}
details.acc>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:.15s;flex:none}
details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc[open]>summary{border-bottom:1px solid var(--line);background:var(--surface2)}
details.acc>.ab{padding:16px clamp(14px,2.4vw,26px) 18px}
.readmark{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;color:var(--muted);margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--brand)}
.tile b{font:800 22px/1 var(--font-display);color:var(--navy)}
.tile span{font-size:13px;color:var(--muted)}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.checks input{width:18px;height:18px;margin-top:4px;accent-color:var(--brand)}
.principle{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.principle .pi{font:800 15px/1 var(--font-display);width:32px;height:32px;border-radius:9px;background:var(--navy);color:var(--surface);display:grid;place-items:center}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gal button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.gal button:hover{border-color:var(--brand)}
.gal img{width:100%;height:130px;object-fit:contain;background:#fff;border-radius:6px}
.gal span{font-size:12.5px;line-height:1.35;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}

/* modal */
.ov{position:fixed;inset:0;background:rgba(8,14,24,.58);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.4);max-width:min(860px,100%);width:100%;max-height:92%;display:flex;flex-direction:column;animation:rise .2s cubic-bezier(.2,.8,.2,1)}
.modal.wide{max-width:min(1180px,100%)}
.modal.sm{max-width:520px}
.modal>.mh{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
.modal>.mh h3{font-size:18px;flex:1;min-width:0}
.modal>.mb{padding:16px 20px 20px;overflow:auto}
.x{border:1px solid var(--line);background:var(--surface2);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(14px) scale(.98);opacity:0}}
.lightbox img{max-width:100%;max-height:78vh;background:#fff;border-radius:8px;display:block;margin:0 auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:200;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:rise .2s}

/* quiz */
.qcard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px 20px}
.qcard .src{font:700 11px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.qcard .qt{font-size:18px;font-weight:600;margin:8px 0 12px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.4}
.opt:hover{border-color:var(--brand)}
.opt .l{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 13px/1 var(--font-display)}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.opt.sel .l{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.qnav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 12px/1 var(--font-mono)}
.qnav button.a{background:color-mix(in srgb,var(--brand) 22%,var(--surface));border-color:var(--brand)}
.qnav button.c{outline:2px solid var(--gold)}
.score{display:grid;place-items:center;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface2) 0);position:relative;flex:none}
.score::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--surface)}
.score b{position:relative;font:800 34px/1 var(--font-display)}
.guide{border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--surface));padding:9px 12px;border-radius:8px;font-size:15px;margin-top:10px}
.lock{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted)}
.cert{width:100%;border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow)}

/* notebook */
.nb{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.nb textarea{width:100%;min-height:420px;resize:vertical;font-size:16px;line-height:1.6;background:repeating-linear-gradient(var(--surface),var(--surface) 25.4px,color-mix(in srgb,var(--navy) 16%,var(--surface)) 26.4px);padding:6px 12px;border-radius:10px}
.pad{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fffef6;touch-action:none}
.pad canvas{display:block;width:100%;height:420px;touch-action:none;cursor:crosshair}
.ptools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--brand)}
.saved{font-size:12.5px;color:var(--muted)}

/* lab */
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.labcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 15px;transition:.15s;min-height:118px}
.labcard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
.labcard .ty{font:700 10.5px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.labcard b{font:700 16px/1.25 var(--font-display)}
.labcard span{font-size:13px;color:var(--muted);line-height:1.4}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.out div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2)}
.out b{display:block;font:800 20px/1.15 var(--font-mono);color:var(--navy)}
.out span{font-size:12.5px;color:var(--muted)}
.gamebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.gamebar .sc{font:700 15px/1 var(--font-mono);padding:6px 10px;border-radius:8px;background:var(--surface2)}
.bigq{font:600 19px/1.4 var(--font-display);margin:6px 0 14px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-weight:600;text-align:left;line-height:1.3}
.choice:hover{border-color:var(--brand)}
.choice.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-color:var(--good)}
.choice.no{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-color:var(--bad)}
.fb{min-height:26px;font-weight:600;margin-top:10px}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem button{min-height:86px;border-radius:10px;border:1.5px solid var(--line);background:var(--navy);color:transparent;font-size:13px;font-weight:600;padding:6px;line-height:1.25;transition:.2s}
.mem button.up{background:var(--surface);color:var(--ink)}
.mem button.done{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--ink);border-color:var(--good)}
.ws{display:inline-grid;gap:2px;user-select:none;touch-action:none}
.ws span{width:28px;height:28px;display:grid;place-items:center;font:700 14px/1 var(--font-mono);border-radius:6px;background:var(--surface2);cursor:pointer}
.ws span.s{background:var(--gold);color:#fff}.ws span.f{background:var(--brand);color:var(--on-brand)}
.seq{display:flex;flex-direction:column;gap:6px}
.seq div{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.seq div span{flex:1}
.flash{perspective:1000px;height:230px;cursor:pointer}
.flash .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
.flash.fl .in{transform:rotateY(180deg)}
.flash .fc{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;padding:20px;text-align:center;background:var(--surface);box-shadow:var(--shadow);overflow:auto}
.flash .bk2{transform:rotateY(180deg);background:color-mix(in srgb,var(--brand) 9%,var(--surface));font-size:15.5px}
.flash .ft{font:800 22px/1.25 var(--font-display);color:var(--navy)}
.hang{font:700 26px/1.4 var(--font-mono);letter-spacing:.18em;word-break:break-word}
.keys{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.keys button{width:34px;height:36px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font:700 14px/1 var(--font-mono)}
.keys button:disabled{opacity:.35}
.map svg{width:100%;height:auto;display:block}
.map .node{cursor:pointer}
.map .node:hover circle,.map .node:hover rect{stroke:var(--gold);stroke-width:3}

/* calculator */
.calc{display:grid;gap:10px}
.calc .disp{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:right;min-height:74px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.calc .ex{font:500 14px/1.3 var(--font-mono);color:var(--muted);min-height:18px;word-break:break-all}
.calc .rs{font:700 28px/1.2 var(--font-mono);word-break:break-all}
.keysg{display:grid;gap:6px}
.keysg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 4px;font:600 15px/1 var(--font-mono)}
.keysg button:hover{border-color:var(--brand)}
.keysg button.op{background:var(--surface2);color:var(--navy)}
.keysg button.eq{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.keysg button.fn{font-size:12.5px;color:var(--muted)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* sheet */
.sheetbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.fx{flex:1;min-width:180px;font-family:var(--font-mono);font-size:14px}
.sheet{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:62vh;background:var(--surface)}
.sheet table{border-collapse:separate;border-spacing:0;font:500 13.5px/1.2 var(--font-mono)}
.sheet th{position:sticky;top:0;background:var(--surface2);z-index:2;font-weight:700;color:var(--muted);padding:5px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:96px}
.sheet th.rh{left:0;z-index:3;min-width:38px}
.sheet th:nth-child(2){min-width:250px}
.sheet td.c:nth-child(2){max-width:250px}
.sheet td.rh{position:sticky;left:0;background:var(--surface2);z-index:1;text-align:center;color:var(--muted);font-weight:700;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;height:26px}
.sheet td.c{padding:4px 6px;white-space:nowrap;overflow:hidden;max-width:180px;text-overflow:ellipsis;cursor:cell}
.sheet td.c.num{text-align:right}
.sheet td.c.sel{outline:2px solid var(--brand);outline-offset:-2px;background:color-mix(in srgb,var(--brand) 8%,var(--surface))}
.sheet td.c.err{color:var(--bad)}
.sheet td.c.b{font-weight:800}
.sheet input.ed{width:100%;height:100%;border:0;border-radius:0;padding:3px 5px;font:inherit;background:var(--surface);outline:2px solid var(--gold)}

/* visuals */
.viz{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px}
.viz svg{width:100%;height:auto;display:block}
.viz h3{font-size:17px;margin-bottom:4px}
.viz p{font-size:14px;color:var(--muted);margin:6px 0 0}
.kb{overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#fff;position:relative;aspect-ratio:16/9}
.kb img{width:100%;height:100%;object-fit:contain;animation:kb 9s ease-in-out both}
@keyframes kb{0%{transform:scale(1.18) translateY(3%);opacity:0}12%{opacity:1}100%{transform:scale(1)}}
.vz-t{font:700 15px var(--font-display);fill:var(--ink)}
.vz-s{font:500 12.5px var(--font-body);fill:var(--muted)}
.vgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr))}

.author{display:grid;grid-template-columns:1fr;gap:6px}
.author .nm{font:800 22px/1.2 var(--font-display);color:var(--navy)}
.author .cr{font:600 13px/1.5 var(--font-mono);color:var(--gold)}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.logos{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logos img{height:96px;border-radius:10px;background:#fff;padding:4px;border:1px solid var(--line)}
.caveat{font-size:14.5px;line-height:1.6}
.foot{border-top:1px solid var(--line);margin-top:34px;padding-top:16px;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
.gl dt{font-weight:700;font-family:var(--font-display);margin-top:10px}
.gl dd{margin:2px 0 0;color:var(--ink)}
.az{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.loading{padding:40px;text-align:center;color:var(--muted)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:orbit .8s linear infinite;margin:0 auto 10px}

@media (max-width:980px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:90;transform:translateX(-102%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.4)}
  #side.open{transform:none}
  #menuBtn{display:inline-flex}
  .hero{grid-template-columns:1fr;text-align:left}
  .hero .coin{margin:8px 14px}
  .nb{grid-template-columns:1fr}
  .clockbar .dt{display:none}
  #top .lbl{display:none}
  #top{gap:7px}
  #top .crumb{flex-basis:100%;order:-1;display:none}
  .search{order:8;flex:1 1 120px;max-width:none}
}
@media (max-width:560px){
  body{font-size:16px}.prose{font-size:16px}
  .chead .no{font-size:34px;min-width:auto}
  .mem{grid-template-columns:repeat(3,1fr)}
  .clockbar .aclock{display:none}
  .clockbar{padding:6px 10px}
  .ws span{width:23px;height:23px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media print{#side,#top{display:none}#app{display:block}#view{overflow:visible}}

</style>
</head>

      if (!db || !user) return;

      const snap = await Promise.race([db.collection('data/users/' + uid).get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);

    let s = null;

const Music = (() => {

let openPop = null;
function popover(anchor, html, setup) {
  if (openPop) { const same = openPop.anchor === anchor; openPop.remove(); openPop = null; if (same) return null; }
  const p = el(`<div class="pop">${html}</div>`); p.anchor = anchor;
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  p.style.top = (r.bottom + 8) + 'px';
  p.style.left = Math.max(8, Math.min(window.innerWidth - p.offsetWidth - 8, r.right - p.offsetWidth)) + 'px';
  openPop = p; if (setup) setup(p);
  return p;
}
document.addEventListener('mousedown', e => { if (openPop && !openPop.contains(e.target) && !openPop.anchor.contains(e.target)) { openPop.remove(); openPop = null; } });

/* ---------- reference shelf ---------- */
function renderWithSolutions(bl) {
  let out = '', buf = null;
  const flush = () => { if (buf) { out += `<details class="sol"><summary>${ic('bulb')} Reveal the suggested solution</summary>${renderBlocks(buf)}</details>`; buf = null; } };
  for (const b of bl) {
    const isSol = b.t === 'h3' && /^(Suggested solution|Marking guide|Suggested solutions|Answers)/i.test(b.h);
    const isQ = b.t === 'h3' && !isSol;
    if (isSol) { flush(); buf = []; continue; }
    if (isQ) { flush(); out += `<h3 class="sec-title" style="font-size:18px">${esc(b.h)}</h3>`; continue; }
    if (buf) buf.push(b); else out += renderBlocks([b]);
  }
  flush(); return out;
}

'use strict';
/* ===== quizzes, randomised numerical drills, certificates ===== */
const ri = (a, b) => a + rnd(b - a + 1);
const af = (r, n) => (1 - Math.pow(1 + r, -n)) / r;
const dfac = (r, n) => Math.pow(1 + r, -n);
const m1 = x => naira(x, 1) + 'm';
const m0 = x => naira(x, 0) + 'm';
function mkNum(q, ans, wrongs, f, e) {
  const seen = new Set([f(ans)]), opts = [f(ans)];
  wrongs.concat([ans * 1.1, ans * 0.9, ans * 1.25, ans * 0.75, ans + 7]).forEach(w => { if (opts.length < 4 && isFinite(w) && w > 0 && !seen.has(f(w))) { seen.add(f(w)); opts.push(f(w)); } });
  return { q, o: opts, a: 0, e, k: 'num' };
}
const NUMGEN = {
  cpp() { const a = ri(20, 90) * 10, i0 = ri(100, 160), i1 = i0 + ri(20, 90); const ans = a * i1 / i0; return mkNum(`An item of plant was bought for <b>${m0(a)}</b> when the general price index stood at ${i0}. The index at the reporting date is ${i1}. Under current purchasing power (CPP) accounting, at what amount is the plant restated (before depreciation)?`, ans, [a * i0 / i1, a + (i1 - i0), a * (i1 - i0) / i0], m1, `Restated amount = historical amount &times; index at reporting date &divide; index at transaction date = ${m0(a)} &times; ${i1} &divide; ${i0} = <b>${m1(ans)}</b>.`); },
  alloc() { const a = ri(30, 80) * 10, b = ri(10, 40) * 10, disc = ri(5, 20); const t = Math.round((a + b) * (1 - disc / 100)); const ans = t * a / (a + b); return mkNum(`A contract bundles equipment (stand-alone selling price <b>${naira(a)}k</b>) and a service plan (stand-alone selling price <b>${naira(b)}k</b>) for a total price of <b>${naira(t)}k</b>. Under IFRS 15, how much of the transaction price is allocated to the equipment?`, ans, [a, t - b, t / 2], x => naira(x, 1) + 'k', `Allocate on relative stand-alone selling prices: ${naira(t)}k &times; ${a} &divide; (${a} + ${b}) = <b>${naira(ans, 1)}k</b>. The discount is spread across both performance obligations.`); },
  nrv() { const u = ri(2, 9) * 100, c = ri(40, 90), sp = c + ri(-15, 12), cs = ri(3, 9); const nrv = sp - cs; const ans = u * Math.min(c, nrv); return mkNum(`An entity holds <b>${fmt(u)}</b> units of a product costing <b>${naira(c)}</b> each. The expected selling price is ${naira(sp)} per unit and selling costs are ${naira(cs)} per unit. At what amount is the inventory measured under IAS 2?`, ans, [u * c, u * sp, u * Math.max(c, nrv), u * (c - cs)], x => naira(x), `Net realisable value = ${naira(sp)} &minus; ${naira(cs)} = ${naira(nrv)} per unit. Lower of cost (${naira(c)}) and NRV (${naira(nrv)}) = ${naira(Math.min(c, nrv))}; ${fmt(u)} units give <b>${naira(ans)}</b>.`); },
  dep() { const c = ri(20, 90) * 10, rv = ri(1, 9) * 10, l = pick([4, 5, 8, 10]), k = ri(2, Math.min(4, l - 1)); const d = (c - rv) / l, ans = c - d * k; return mkNum(`Equipment costing <b>${m0(c)}</b> has a residual value of ${m0(rv)} and a useful life of ${l} years. Using straight-line depreciation, what is its carrying amount after ${k} years?`, ans, [c - (c / l) * k, c - d * (k - 1), d * k], m1, `Annual depreciation = (${c} &minus; ${rv}) &divide; ${l} = ${m1(d)}. Carrying amount = ${m0(c)} &minus; ${k} &times; ${m1(d)} = <b>${m1(ans)}</b>.`); },
  borrow() { const L = ri(5, 30) * 100, r = ri(12, 24), mth = pick([6, 8, 9, 10]), inc = ri(5, 30); const ans = L * r / 100 * mth / 12 - inc; return mkNum(`An entity borrowed <b>${m0(L)}</b> at ${r}% a year specifically to build a qualifying asset. Construction ran for ${mth} months of the year, and surplus funds were temporarily invested to earn <b>${m0(inc)}</b> during that period. What amount of borrowing costs is capitalised under IAS 23?`, ans, [L * r / 100 - inc, L * r / 100 * mth / 12, L * r / 100], m1, `Borrowing cost in the construction period = ${m0(L)} &times; ${r}% &times; ${mth}/12 = ${m1(L * r / 100 * mth / 12)}; less investment income ${m0(inc)} = <b>${m1(ans)}</b>.`); },
  impair() { const ca = ri(40, 90) * 10, fv = ca - ri(5, 25) * 10, viu = ca - ri(3, 22) * 10 + 5; const rec = Math.max(fv, viu), ans = ca - rec; return mkNum(`A cash-generating unit has a carrying amount of <b>${m0(ca)}</b>. Its fair value less costs of disposal is ${m0(fv)} and its value in use is ${m0(viu)}. What impairment loss is recognised under IAS 36?`, ans, [ca - Math.min(fv, viu), ca - (fv + viu) / 2, Math.abs(fv - viu)], m0, `Recoverable amount is the <b>higher</b> of fair value less costs of disposal (${m0(fv)}) and value in use (${m0(viu)}) = ${m0(rec)}. Impairment = ${m0(ca)} &minus; ${m0(rec)} = <b>${m0(ans)}</b>.`); },
  lease() { const p = ri(5, 30) * 10, n = ri(3, 6), r = pick([8, 10, 12, 15]) / 100; const f = af(r, n), ans = p * f; return mkNum(`A lessee agrees to pay <b>${m0(p)}</b> a year in arrears for ${n} years. Its incremental borrowing rate is ${r * 100}% (annuity factor ${f.toFixed(4)}). What is the lease liability at commencement under IFRS 16?`, ans, [p * n, p * (1 + af(r, n - 1)), p * dfac(r, n)], m1, `Lease liability = present value of the payments = ${m0(p)} &times; ${f.toFixed(4)} = <b>${m1(ans)}</b>. The undiscounted total of ${m0(p * n)} is not the liability.`); },
  leaseInt() { const p = ri(5, 30) * 10, n = ri(3, 6), r = pick([8, 10, 12]) / 100; const L = p * af(r, n), ans = L * r; return mkNum(`A lease liability of <b>${m1(L)}</b> is recognised at commencement, with payments of ${m0(p)} a year in arrears and an incremental borrowing rate of ${r * 100}%. What interest expense is charged in the first year?`, ans, [p * r, (L - p) * r, p - L * r], m1, `Interest = opening liability &times; rate = ${m1(L)} &times; ${r * 100}% = <b>${m1(ans)}</b>. The liability at the end of year 1 is ${m1(L + ans - p)}.`); },
  prov() { const fcash = ri(10, 60) * 10, n = pick([5, 8, 10, 15]), r = pick([6, 8, 10]) / 100; const ans = fcash * dfac(r, n); return mkNum(`An entity must dismantle a facility in ${n} years at an estimated cost of <b>${m0(fcash)}</b>. The appropriate pre-tax discount rate is ${r * 100}% (discount factor ${dfac(r, n).toFixed(4)}). What provision is recognised today under IAS 37?`, ans, [fcash, fcash / n, fcash * af(r, n) / n], m1, `Provision = present value = ${m0(fcash)} &times; ${dfac(r, n).toFixed(4)} = <b>${m1(ans)}</b>. The same amount is added to the cost of the asset, and the discount unwinds as a finance cost.`); },
  sbp() { const N = ri(5, 30) * 10, o = pick([100, 200, 500]), fv = ri(4, 15), lv = pick([10, 15, 20]), v = 3; const ans = N * (1 - lv / 100) * o * fv / v / 1000; return mkNum(`On 1 January an entity grants <b>${o}</b> share options to each of ${N} employees, vesting after ${v} years of service. The fair value of each option at grant date is ${naira(fv)}. It expects ${lv}% of employees to leave before vesting. What expense is recognised in the first year under IFRS 2?`, ans, [N * o * fv / v / 1000, N * (1 - lv / 100) * o * fv / 1000, N * (lv / 100) * o * fv / v / 1000], x => naira(x, 1) + 'k', `Expense = ${N} &times; ${100 - lv}% &times; ${o} options &times; ${naira(fv)} &times; 1/${v} = <b>${naira(ans, 1)}k</b>, with a matching credit to equity. Grant-date fair value is not remeasured.`); },
  compound() { const F = ri(2, 9) * 1000, c = pick([4, 5, 6]) / 100, r = c + pick([3, 4, 5]) / 100, n = 3; const liab = F * c * af(r, n) + F * dfac(r, n), ans = F - liab; return mkNum(`An entity issues <b>${m0(F)}</b> of ${n}-year convertible bonds at par, paying interest of ${(c * 100).toFixed(0)}% a year in arrears. Similar bonds without a conversion right carry interest at ${(r * 100).toFixed(0)}% (annuity factor ${af(r, n).toFixed(4)}; discount factor ${dfac(r, n).toFixed(4)}). What amount is recognised in equity under IAS 32?`, ans, [liab, F * c * af(r, n), F * (r - c)], m1, `Liability = PV of interest (${m1(F * c)} &times; ${af(r, n).toFixed(4)}) + PV of principal (${m0(F)} &times; ${dfac(r, n).toFixed(4)}) = ${m1(liab)}. Equity is the residual: ${m0(F)} &minus; ${m1(liab)} = <b>${m1(ans)}</b>.`); },

  dtax() { const c = ri(20, 90) * 10, l = pick([5, 8, 10]), ca_rate = pick([25, 50]), rate = 30; const cv = c - c / l, tb = c - c * ca_rate / 100, td = cv - tb, ans = td * rate / 100; return mkNum(`Plant costing <b>${m0(c)}</b> is depreciated straight-line over ${l} years. In the first year the tax authority grants a capital allowance of ${ca_rate}% of cost. The tax rate is ${rate}%. What deferred tax liability arises at the end of the first year under IAS 12?`, ans, [td, cv * rate / 100, tb * rate / 100, (c * ca_rate / 100) * rate / 100], m1, `Carrying amount = ${m1(cv)}; tax base = ${m1(tb)}; taxable temporary difference = ${m1(td)}. Deferred tax liability = ${m1(td)} &times; ${rate}% = <b>${m1(ans)}</b>.`); },

  purp() { const x = ri(10, 60) * 10, mg = pick([20, 25, 30, 40]), fr = pick([25, 40, 50]); const ans = x * fr / 100 * mg / 100; return mkNum(`During the year P sold goods to its subsidiary S for <b>${m0(x)}</b> at a gross margin of ${mg}%. At the year end, ${fr}% of these goods remain in S's inventory. What is the provision for unrealised profit?`, ans, [x * mg / 100, x * fr / 100, x * fr / 100 * mg / (100 + mg)], m1, `Unrealised profit = goods still in the group (${m0(x)} &times; ${fr}% = ${m1(x * fr / 100)}) &times; margin ${mg}% = <b>${m1(ans)}</b>. Reduce group inventory and the seller's profit by this amount.`); },
  assoc() { const c = ri(20, 80) * 10, sh = pick([25, 30, 40]), prof = ri(10, 40) * 10, div = ri(2, 9) * 10; const ans = c + sh / 100 * prof - sh / 100 * div; return mkNum(`An investor paid <b>${m0(c)}</b> for ${sh}% of an associate. Since acquisition the associate has earned profits of ${m0(prof)} and paid dividends of ${m0(div)}. What is the carrying amount of the investment under the equity method (IAS 28)?`, ans, [c + sh / 100 * prof, c + prof - div, c + sh / 100 * (prof + div)], m1, `Carrying amount = cost ${m0(c)} + share of profit (${sh}% &times; ${m0(prof)}) &minus; dividends received (${sh}% &times; ${m0(div)}) = <b>${m1(ans)}</b>.`); },
  fx() { const usd = ri(2, 20) * 100, r1 = ri(140, 160) * 10, up = Math.random() < 0.7, r2 = r1 + (up ? 1 : -1) * ri(3, 12) * 10; const diff = usd * Math.abs(r2 - r1) / 1000; const f = (x, loss) => `${loss ? 'Loss' : 'Gain'} of ${naira(x, 1)}m`; const opts = [f(diff, up), f(diff, !up), f(usd * r2 / 1000, up), 'No gain or loss until settlement']; return { q: `A Nigerian company bought equipment for <b>$${fmt(usd)}k</b> on credit when the rate was ${naira(r1)} to the dollar. The payable is unsettled at the year end, when the rate is ${naira(r2)}. What exchange difference is recognised in profit or loss under IAS 21?`, o: opts, a: 0, k: 'num', e: `The payable is a monetary item, retranslated at the closing rate: $${fmt(usd)}k &times; (${naira(r2)} &minus; ${naira(r1)}) = ${naira(diff, 1)}m. The naira ${up ? 'weakened, so the liability grew: a <b>loss</b>' : 'strengthened, so the liability fell: a <b>gain</b>'}. The equipment stays at the historical rate.` }; },

  gear() { const debt = ri(10, 60) * 10, eq = ri(30, 90) * 10; const ans = debt / (debt + eq) * 100; return mkNum(`A company has borrowings and lease liabilities totalling <b>${m0(debt)}</b> and equity of <b>${m0(eq)}</b>. Using the formula in this book, debt &divide; (debt + equity), what is its gearing?`, ans, [debt / eq * 100, eq / (debt + eq) * 100, eq / debt * 10], x => x.toFixed(1) + '%', `Gearing = ${debt} &divide; (${debt} + ${eq}) = <b>${ans.toFixed(1)}%</b>. Debt includes lease liabilities.`); },

  ghg1() { const l = ri(5, 90) * 1000; const ans = l * 2.68 / 1000; return mkNum(`A company's generators burned <b>${fmt(l)} litres</b> of diesel in the year. Using the illustrative emission factor in this book of 2.68 kg CO<sub>2</sub>e per litre, what Scope 1 emissions does it report?`, ans, [l * 2.68, l * 0.4 / 1000, l / 2.68 / 1000], x => fmt(x, 1) + ' tCO₂e', `Emissions = activity data &times; emission factor = ${fmt(l)} litres &times; 2.68 kg &divide; 1,000 = <b>${fmt(ans, 1)} tonnes CO<sub>2</sub>e</b>. Fuel burned in owned equipment is Scope 1.`); },

  held() { const ca = ri(30, 90) * 10, fv = ca - ri(2, 15) * 10, cs = ri(1, 5) * 5; const ans = ca - (fv - cs); return mkNum(`An asset with a carrying amount of <b>${m0(ca)}</b> is classified as held for sale. Its fair value is ${m0(fv)} and costs to sell are ${m0(cs)}. What impairment loss is recognised on classification under IFRS 5?`, ans, [ca - fv, cs, fv - cs], m0, `Measure at the lower of carrying amount (${m0(ca)}) and fair value less costs to sell (${m0(fv)} &minus; ${m0(cs)} = ${m0(fv - cs)}). Impairment = <b>${m0(ans)}</b>.`); },

  pool(S, N) {

    let out = [];

    if (cfg.scope === 'ch') {
      const n = cfg.n, part = partOf(n);
      take(shuffle(tag(M.book[n], `Chapter ${n} textbook MCQ`)));

      const gens = NUMMAP[n] || []; const nums = [];

      take(shuffle(ex.concat(nums)));

      take(sib);

    run(v) { const yrs = Math.max(1, Math.min(3, Math.round(v.v))), est = [v.l1, v.l2, v.l3]; let cum = 0; const rows = []; for (let k = 1; k <= yrs; k++) { const c = v.n * v.o * v.fv * est[k - 1] / 100 * k / yrs / 1e6; rows.push([k, est[k - 1] + '%', c, c - cum]); cum = c; } return { out: [['Total grant-date fair value', m1(v.n * v.o * v.fv / 1e6)], ['Cumulative expense at the end', m1(cum)], ['Credit to equity', m1(cum)]], head: ['Year', 'Expected to vest', 'Cumulative expense (₦m)', 'Expense for the year (₦m)'], rows, note: 'Grant-date fair value is not remeasured for an equity-settled scheme. Only the estimate of the number of instruments expected to vest is trued up each year.' }; } },

const LAB = {
  open(id) {
    const c = LABCALC.find(x => x.id === id); if (c) return this.calc(c);
    const g = LABGAMES.find(x => x.id === id); if (g) { const ov = modal(esc(g.name), '<div id="gm"></div>', g.wide ? 'wide' : ''); g.run($('#gm', ov)); }
  },
  calc(c) {
    const ov = modal(`<span class="eyebrow">${esc(c.std)}</span><br>${esc(c.name)}`, `<p class="muted">${esc(c.desc)} <a href="#ch${c.ch}" id="lcCh">Study Chapter ${c.ch}</a></p><div class="form">${c.inputs.map(i => Array.isArray(i) ? `<label class="f" for="lc_${i[0]}">${i[1]}<input type="number" step="any" id="lc_${i[0]}" value="${i[2]}"></label>` : `<label class="f" for="lc_${i.id}">${i.label}<select id="lc_${i.id}">${i.opts.map(o => `<option value="${o[0]}" ${o[0] === i.def ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></label>`).join('')}</div><div id="lcOut"></div>`, 'wide');
    $('#lcCh', ov).onclick = ov.close;
    const go = () => {
      const v = {}; c.inputs.forEach(i => { if (Array.isArray(i)) v[i[0]] = parseFloat($('#lc_' + i[0], ov).value) || 0; else v[i.id] = $('#lc_' + i.id, ov).value; });
      let r; try { r = c.run(v); } catch (e) { $('#lcOut', ov).innerHTML = '<p class="muted">Check the inputs.</p>'; return; }
      const cell = x => typeof x === 'number' ? `<td class="n">${fmt(x, Math.abs(x) < 100 && !Number.isInteger(x) ? 2 : (Number.isInteger(x) ? 0 : 1))}</td>` : `<td>${esc(x)}</td>`;
      $('#lcOut', ov).innerHTML = `<div class="out">${r.out.map(o => `<div><b>${esc(o[1])}</b><span>${esc(o[0])}</span></div>`).join('')}</div>
        ${r.chart ? barChart(r.chart) : ''}
        ${r.head ? `<div class="tw"><table><thead><tr>${r.head.map((h, i) => `<th${i ? ' class="n"' : ''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${r.rows.map(row => `<tr>${row.map(cell).join('')}</tr>`).join('')}</tbody></table></div>` : ''}
        ${r.note ? `<div class="guide">${esc(r.note)}</div>` : ''}`;
    };
    ov.body.addEventListener('input', go); go();
  }
};
function barChart(c) {
  const W = 640, H = 200, L = 46, B = 26, n = c.labels.length, two = !!c.b, max = Math.max(1e-9, ...c.a, ...(c.b || [])) * 1.1, gw = (W - L - 10) / n, bw = Math.min(46, gw / (two ? 2.6 : 1.6));
  const y = v => H - B - (v / max) * (H - B - 12);
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:640px;height:auto;display:block;margin:6px 0" role="img" aria-label="Chart">`;
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; s += `<line x1="${L}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="vz-s">${fmt(v, 0)}</text>`; }
  c.labels.forEach((lb, i) => { const x0 = L + gw * i + gw / 2; s += `<rect x="${x0 - (two ? bw : bw / 2)}" y="${y(c.a[i])}" width="${bw}" height="${H - B - y(c.a[i])}" fill="var(--brand)" rx="3"><animate attributeName="height" from="0" to="${H - B - y(c.a[i])}" dur=".5s" fill="freeze"/><animate attributeName="y" from="${H - B}" to="${y(c.a[i])}" dur=".5s" fill="freeze"/></rect>`; if (two) s += `<rect x="${x0 + 2}" y="${y(c.b[i])}" width="${bw}" height="${H - B - y(c.b[i])}" fill="var(--gold)" rx="3"/>`; s += `<text x="${x0}" y="${H - 8}" text-anchor="middle" class="vz-s">${esc(lb)}</text>`; });
  s += '</svg>';
  return s + `<div class="row" style="font-size:12.5px;gap:14px"><span><i style="display:inline-block;width:10px;height:10px;background:var(--brand);border-radius:2px"></i> ${esc(c.an)}</span>${two ? `<span><i style="display:inline-block;width:10px;height:10px;background:var(--gold);border-radius:2px"></i> ${esc(c.bn)}</span>` : ''}</div>`;
}

  flash(root, cards) {

  scramble(root, terms) {
    const s = G.bar(root), b = $('#gBody', root); let deck = shuffle(terms);
    const mix = w => { if (w.length < 3) return w; let r, k = 0; do { r = shuffle(w.split('')).join(''); } while (r === w && k++ < 8); return r; };
    const show = () => {
      if (!deck.length) deck = shuffle(terms);
      const t = deck.pop(), ans = t[0], sc = ans.split(' ').map(w => mix(w.toUpperCase())).join('   ');
      b.innerHTML = `<p class="muted">Unscramble the term. Each word is scrambled separately.</p><div class="hang">${esc(sc)}</div>${t[1] ? `<div class="guide"><b>Clue:</b> ${t[1]}</div>` : ''}<div class="row" style="margin-top:12px"><input type="text" id="scIn" placeholder="Type the term" style="flex:1;min-width:200px" autocomplete="off" aria-label="Your answer"><button class="btn sm" id="scGo">Check</button><button class="btn sm ghost" id="scSkip">Reveal and move on</button></div><div class="fb" id="gFb"></div>`;

      const check = () => { if (norm(inp.value) === norm(ans)) { s.hit(true); fb.className = 'fb ok'; fb.textContent = 'Correct: ' + ans; setTimeout(show, 900); } else { fb.className = 'fb no'; fb.textContent = 'Not yet. Look at the clue again.'; } };

  hangman(root, terms) {
    const s = G.bar(root), b = $('#gBody', root); let deck = shuffle(terms);
    const show = () => {
      if (!deck.length) deck = shuffle(terms);
      const t = deck.pop(), ans = t[0].toUpperCase(); const got = new Set(); let lives = 7;
      const draw = () => {
        const shown = ans.split('').map(ch => /[A-Z]/.test(ch) ? (got.has(ch) ? ch : '_') : ch).join('');
        const won = !shown.includes('_'), lost = lives <= 0;
        b.innerHTML = `<p class="muted">Guess the term from its definition, one letter at a time. Lives left: <b>${'●'.repeat(lives)}${'○'.repeat(7 - lives)}</b></p><div class="guide">${t[1]}</div><div class="hang" style="margin-top:12px">${esc(lost ? ans : shown)}</div><div class="keys">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l => `<button data-l="${l}" ${got.has(l) || won || lost ? 'disabled' : ''}>${l}</button>`).join('')}</div><div class="fb ${won ? 'ok' : 'no'}">${won ? 'You have it.' : lost ? 'Out of lives. The term is shown above.' : ''}</div>${won || lost ? `<button class="btn sm" id="hgN">Next term ${ic('right')}</button>` : ''}`;
        if (won || lost) { s.hit(won); $('#hgN', b).onclick = show; }
      };
      b.onclick = e => { const k = e.target.closest('[data-l]'); if (!k || k.disabled) return; const l = k.dataset.l; got.add(l); if (!ans.includes(l)) lives--; draw(); };
      draw();

    if (terms.length) show(); else b.innerHTML = '<p class="muted">No terms available.</p>';
  },
  memory(root, pairs) {
    pairs = sample(pairs, Math.min(6, pairs.length));
    const cards = shuffle(pairs.flatMap((p, i) => [{ k: i, t: p[0] }, { k: i, t: p[1] }])); let open = [], done = 0, moves = 0;
    root.innerHTML = `<div class="gamebar"><span class="sc" id="mmM">Moves 0</span><span class="sc" id="mmD">Pairs 0 / ${pairs.length}</span><button class="btn sm ghost" id="mmR">${ic('redo')} New game</button></div><div class="mem">${cards.map((c, i) => `<button data-i="${i}">${esc(c.t)}</button>`).join('')}</div><div class="fb ok" id="gFb"></div>`;
    $('#mmR', root).onclick = () => G.memory(root, root._pairs);
    root.onclick = e => { const b = e.target.closest('[data-i]'); if (!b || b.classList.contains('up') || b.classList.contains('done') || open.length === 2) return; b.classList.add('up'); open.push(b); if (open.length === 2) { moves++; $('#mmM', root).textContent = 'Moves ' + moves; const [x, y] = open; if (cards[+x.dataset.i].k === cards[+y.dataset.i].k) { x.classList.add('done'); y.classList.add('done'); open = []; done++; $('#mmD', root).textContent = `Pairs ${done} / ${pairs.length}`; if (done === pairs.length) $('#gFb', root).textContent = `Complete in ${moves} moves. Start a new game for a fresh set.`; } else setTimeout(() => { x.classList.remove('up'); y.classList.remove('up'); open = []; }, 1000); } };
  },
  wordsearch(root, words) {
    words = sample(words.map(w => w.toUpperCase().replace(/[^A-Z]/g, '')).filter(w => w.length >= 4 && w.length <= 11), 8);
    const N = 12, grid = Array.from({ length: N }, () => Array(N).fill('')), placed = [];
    const dirs = [[0, 1], [1, 0], [1, 1], [-1, 1]];
    words.forEach(w => { for (let t = 0; t < 120; t++) { const [dr, dc] = pick(dirs), r = rnd(N), c = rnd(N), er = r + dr * (w.length - 1), ec = c + dc * (w.length - 1); if (er < 0 || er >= N || ec < 0 || ec >= N) continue; let ok = true; for (let k = 0; k < w.length; k++) { const g = grid[r + dr * k][c + dc * k]; if (g && g !== w[k]) { ok = false; break; } } if (!ok) continue; for (let k = 0; k < w.length; k++) grid[r + dr * k][c + dc * k] = w[k]; placed.push({ w, r, c, dr, dc }); break; } });
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) grid[r][c] = 'ABCDEFGHIKLMNOPRSTUVWY'[rnd(22)];

    };
  },

const ChapterGames = {
  async mount(c, ch) {
    c.innerHTML = '<div class="loading"><div class="spinner"></div>Setting up the games</div>';
    const M = await loadMcq(), n = ch.n, ex = M.extra[n] || [];
    const pairs = []; const seen = new Set();
    ex.filter(q => q.k === 'term').forEach(q => { const m = /^<b>(.*?)<\/b>: (.*)$/.exec(q.e); if (m && !seen.has(m[1])) { seen.add(m[1]); pairs.push([plain(m[1]).replace(/\s*\(.*?\)/g, ''), m[2]]); } });
    const points = (ch.review || []).filter(b => b.t === 'ul').flatMap(b => b.i).map((p, i) => ['Key point ' + (i + 1), p.h, 'Chapter ' + n + ' summary']);
    const cloze = ex.filter(q => q.k === 'cloze');
    const terms = (ch.terms || []).filter(t => t.length >= 4 && t.length <= 30).map(t => [t, `A key term of Chapter ${n}: ${esc(chMeta(n).ti)}`]);
    const words = (ch.terms || []).flatMap(t => t.split(/[\s\-\/]+/)).filter(w => /^[A-Za-z]{4,11}$/.test(w));
    const gens = NUMMAP[n] || [];
    const games = [
      ['Flashcards', 'Key terms and key points of this chapter on turning cards.', r => G.flash(r, pairs.map(p => [p[0], p[1], 'Key term']).concat(points))],
      ['Right or Wrong', 'This chapter\'s textbook questions, one proposed answer at a time.', r => G.rightWrong(r, M.book[n])],

      [...new Set(words.map(w => w.toUpperCase()))].length >= 6 ? ['Word Search', 'Find this chapter\'s vocabulary in a fresh grid.', r => { r._words = [...new Set(words.map(w => w.toUpperCase()))]; G.wordsearch(r, r._words); }] : null,
      pairs.length >= 3 ? ['Memory Match', 'Pair each term with its meaning.', r => { r._pairs = pairs.map(p => [p[0], plain(p[1]).slice(0, 70) + (plain(p[1]).length > 70 ? '...' : '')]); G.memory(r, r._pairs); }] : null,

    { id: 'i18', ch: 9, title: 'IFRS 18: the new shape of profit or loss', text: 'Income and expenses fall into operating, investing, financing, income taxes and discontinued operations. Two new required subtotals appear: operating profit, and profit before financing and income taxes.', svg() {
      const rows = [['Operating category', 420, 'var(--brand)'], ['Operating profit', 300, 'var(--navy)', 1], ['Investing category', 70, 'var(--gold)'], ['Profit before financing and income taxes', 370, 'var(--navy)', 1], ['Financing category', 90, '#7a55b5'], ['Profit before income taxes', 280, 'var(--navy)', 1], ['Income taxes', 84, '#c0392b'], ['Discontinued operations', 30, '#64748b'], ['Profit for the year', 226, 'var(--navy)', 1]];
      return `<svg viewBox="0 0 640 310">${rows.map((r, i) => `<g opacity=".12">${seqOp(i, rows.length, 10)}<rect x="318" y="${12 + i * 32}" width="${r[1] * 0.72}" height="22" rx="5" fill="${r[2]}" ${r[3] ? '' : 'opacity=".75"'}/>${T(310, 28 + i * 32, r[0], r[3] ? 'vz-t' : 'vz-s', 'end', r[3] ? '' : 'style="fill:var(--ink)"')}</g>`).join('')}</svg>`; } },
    { id: 'lease', ch: 24, title: 'IFRS 16: why the lease expense is front-loaded', text: 'Depreciation is level, but interest falls as the liability is repaid. The total expense starts above the cash rent and ends below it.', svg() {
      const p = 150, n = 5, r = 0.1, L = p * af(r, n), dep = L / n; let bal = L; const pts = []; for (let k = 0; k < n; k++) { const int = bal * r; pts.push(int + dep); bal += int - p; }
      const X = k => 80 + k * 120, Y = v => 250 - (v - 110) * 3.800;
      const path = pts.map((v, k) => `${k ? 'L' : 'M'}${X(k)} ${Y(v)}`).join(' ');
      return `<svg viewBox="0 0 640 290"><line x1="60" y1="250" x2="600" y2="250" stroke="var(--line)" stroke-width="1.500"/><line x1="60" y1="30" x2="60" y2="250" stroke="var(--line)" stroke-width="1.500"/>
      <line x1="60" y1="${Y(p)}" x2="600" y2="${Y(p)}" stroke="var(--gold)" stroke-width="3" stroke-dasharray="8 6"/>${T(596, Y(p) - 8, 'Cash rent ₦150m', 'vz-s', 'end', 'style="fill:var(--gold);font-weight:700"')}

      ${pts.map((v, k) => `<circle cx="${X(k)}" cy="${Y(v)}" r="6" fill="var(--brand)"/>${T(X(k), Y(v) - 12, '₦' + v.toFixed(1) + 'm', 'vz-s', 'middle', 'style="fill:var(--ink);font-weight:700"')}${T(X(k), 270, 'Year ' + (k + 1), 'vz-s')}`).join('')}
      ${T(596, 44, 'IFRS 16 expense: interest plus depreciation', 'vz-t', 'end', 'style="fill:var(--brand)"')}</svg>`; } },
    { id: 'ecl', ch: 34, title: 'IFRS 9: the three stages of expected credit loss', text: 'Loans migrate as credit risk changes. Stage 1 carries 12-month losses; a significant increase in credit risk moves a loan to lifetime losses; credit-impaired loans earn interest on the net amount.', svg() {
      const st = [['Stage 1', 'Performing', '12-month ECL', 'var(--brand)'], ['Stage 2', 'Significant increase in credit risk', 'Lifetime ECL', 'var(--gold)'], ['Stage 3', 'Credit-impaired', 'Lifetime ECL; interest on net', '#c0392b']];
      return `<svg viewBox="0 0 640 230">${st.map((s, i) => `<rect x="${20 + i * 210}" y="40" width="190" height="130" rx="12" fill="var(--surface2)" stroke="${s[3]}" stroke-width="3"/>${T(115 + i * 210, 68, s[0], 'vz-t', 'middle', `style="fill:${s[3]};font-size:16px"`)}${T(115 + i * 210, 90, s[1], 'vz-s', 'middle', 'style="fill:var(--ink)"')}${T(115 + i * 210, 150, s[2], 'vz-s', 'middle', 'style="fill:var(--ink);font-weight:700"')}`).join('')}
      ${[0, 1, 2, 3, 4].map(k => `<circle r="7" fill="var(--navy)"><animateMotion path="M70 118 H${k % 2 ? 540 : 330}" dur="${5 + k * 0.7}s" begin="${k * 0.9}s" repeatCount="indefinite"/></circle>`).join('')}
      <circle r="7" fill="var(--brand)"><animateMotion path="M330 126 H80" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
      ${T(320, 205, 'Movement in both directions: credit risk can worsen, and it can cure', 'vz-s')}</svg>`; } },
    { id: 'group', ch: 41, title: 'Consolidation: from parent and subsidiary to one group', text: 'The parent controls the subsidiary, so 100% of its assets and liabilities are added line by line. The share the parent does not own appears as non-controlling interest within equity.', svg() {
      return `<svg viewBox="0 0 640 260"><g><circle cx="150" cy="120" r="70" fill="var(--navy)"/>${T(150, 116, 'Parent', 'vz-t', 'middle', 'style="fill:var(--surface);font-size:16px"')}${T(150, 136, 'owns 75%', 'vz-s', 'middle', 'style="fill:var(--surface)"')}<animateTransform attributeName="transform" type="translate" values="0 0;110 0;110 0;0 0" keyTimes="0;.4;.9;1" dur="8s" repeatCount="indefinite"/></g>
      <g><circle cx="490" cy="120" r="52" fill="var(--brand)"/><path d="M490 120 L490 68 A52 52 0 0 1 542 120 Z" fill="var(--gold)"/>${T(478, 142, 'Subsidiary', 'vz-t', 'middle', 'style="fill:#fff"')}${T(516, 100, 'NCI', 'vz-s', 'middle', 'style="fill:#fff;font-weight:700"')}<animateTransform attributeName="transform" type="translate" values="0 0;-140 0;-140 0;0 0" keyTimes="0;.4;.9;1" dur="8s" repeatCount="indefinite"/></g>
      <rect x="170" y="30" width="300" height="180" rx="90" fill="none" stroke="var(--gold)" stroke-width="3" stroke-dasharray="10 8" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.38;.5;.9;1" dur="8s" repeatCount="indefinite"/></rect>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.55;.9;1" dur="8s" repeatCount="indefinite"/>${T(320, 238, 'One economic entity: 100% of net assets, with 25% shown as NCI in equity', 'vz-t')}</g></svg>`; } },
    { id: 'ghg', ch: 70, title: 'IFRS S2: greenhouse gas emissions across the value chain', text: 'Scope 1 comes from sources the entity owns or controls. Scope 2 comes from purchased energy. Scope 3 covers the rest of the value chain, upstream and downstream.', svg() {
      const flow = (d, c, dur, b) => `<circle r="5" fill="${c}"><animateMotion path="${d}" dur="${dur}s" begin="${b}s" repeatCount="indefinite"/></circle>`;
      return `<svg viewBox="0 0 640 270"><rect x="240" y="100" width="160" height="90" rx="12" fill="var(--navy)"/>${T(320, 138, 'Reporting entity', 'vz-t', 'middle', 'style="fill:var(--surface)"')}${T(320, 158, 'Scope 1: direct', 'vz-s', 'middle', 'style="fill:var(--gold);font-weight:700"')}
      <rect x="20" y="110" width="150" height="70" rx="10" fill="var(--surface2)" stroke="var(--brand)" stroke-width="2"/>${T(95, 140, 'Suppliers', 'vz-t')}${T(95, 158, 'Scope 3 upstream', 'vz-s')}
      <rect x="470" y="110" width="150" height="70" rx="10" fill="var(--surface2)" stroke="var(--brand)" stroke-width="2"/>${T(545, 140, 'Customers', 'vz-t')}${T(545, 158, 'Scope 3 downstream', 'vz-s')}
      <rect x="245" y="14" width="150" height="50" rx="10" fill="var(--surface2)" stroke="var(--gold)" stroke-width="2"/>${T(320, 36, 'Purchased energy', 'vz-t')}${T(320, 52, 'Scope 2', 'vz-s')}
      <path d="M170 145 H240 M400 145 H470 M320 64 V100" stroke="var(--line)" stroke-width="3" fill="none"/>
      ${flow('M170 145 H240', 'var(--brand)', 2.200, 0)}${flow('M170 145 H240', 'var(--brand)', 2.200, 1.100)}${flow('M400 145 H470', 'var(--brand)', 2.200, 0.500)}${flow('M320 64 V100', 'var(--gold)', 1.800, 0)}
      ${[0, 1, 2].map(k => `<circle cx="${290 + k * 30}" cy="100" r="6" fill="#94a3b8" opacity=".8"><animate attributeName="cy" values="100;76" dur="2.400s" begin="${k * 0.6}s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.400s" begin="${k * 0.6}s" repeatCount="indefinite"/></circle>`).join('')}
      ${T(320, 230, 'Activity data × emission factor = emissions, converted to CO₂ equivalent', 'vz-s', 'middle', 'style="fill:var(--ink);font-weight:700"')}${T(320, 250, 'Scope 3 is usually the largest and the hardest to measure', 'vz-s')}</svg>`; } },
    { id: 'scale', ch: 4, title: 'The accounting equation always balances', text: 'Every transaction has a dual effect. Whatever is added to one side of the scale is matched on the other: assets equal liabilities plus equity.', svg() {
      return `<svg viewBox="0 0 640 270"><path d="M320 70 V230 M250 230 H390" stroke="var(--navy)" stroke-width="8" stroke-linecap="round"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0 320 70;-7 320 70;-7 320 70;0 320 70;0 320 70" keyTimes="0;.2;.45;.65;1" dur="7s" repeatCount="indefinite"/>
      <line x1="120" y1="70" x2="520" y2="70" stroke="var(--gold)" stroke-width="7" stroke-linecap="round"/>
      <path d="M120 70 L80 150 H160 Z" fill="none" stroke="var(--muted)" stroke-width="2"/><path d="M520 70 L480 150 H560 Z" fill="none" stroke="var(--muted)" stroke-width="2"/>
      <rect x="70" y="150" width="100" height="14" rx="4" fill="var(--navy)"/><rect x="470" y="150" width="100" height="14" rx="4" fill="var(--navy)"/>
      <rect x="85" y="112" width="70" height="38" rx="6" fill="var(--brand)"/>${T(120, 136, 'Assets', 'vz-t', 'middle', 'style="fill:#fff"')}
      <rect x="478" y="112" width="42" height="38" rx="6" fill="#c0392b"/>${T(499, 136, 'L', 'vz-t', 'middle', 'style="fill:#fff"')}<rect x="522" y="112" width="42" height="38" rx="6" fill="var(--gold)"/>${T(543, 136, 'E', 'vz-t', 'middle', 'style="fill:#fff"')}
      <rect x="95" y="80" width="50" height="30" rx="6" fill="var(--brand)" opacity="0"><animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;.15;.5;.95;1" dur="7s" repeatCount="indefinite"/></rect>
      <rect x="495" y="80" width="50" height="30" rx="6" fill="#c0392b" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.6;.95;1" dur="7s" repeatCount="indefinite"/></rect></g>
      <circle cx="320" cy="70" r="11" fill="var(--navy)"/>${T(320, 258, 'Buy equipment on credit: assets rise, then liabilities rise to match', 'vz-s')}</svg>`; } },
    { id: 'due', ch: 1, title: 'How a Standard is born: the due process', text: 'From agenda consultation to post-implementation review, every stage is public. That openness gives the Standards their legitimacy.', svg() {
      const st = ['Agenda consultation', 'Research', 'Discussion Paper', 'Exposure Draft', 'Redeliberation', 'Final Standard', 'Post-implementation review'];
      return `<svg viewBox="0 0 640 200"><line x1="40" y1="90" x2="600" y2="90" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/><line x1="40" y1="90" x2="40" y2="90" stroke="var(--brand)" stroke-width="6" stroke-linecap="round"><animate attributeName="x2" values="40;600;600" keyTimes="0;.85;1" dur="9s" repeatCount="indefinite"/></line>
      ${st.map((s, i) => { const x = 40 + i * 93.300; const w = s.split(' '); return `<g opacity=".15">${seqOp(i, st.length, 9)}<circle cx="${x}" cy="90" r="13" fill="var(--gold)"/>${T(x, 95, i + 1, 'vz-t', 'middle', 'style="fill:#fff"')}${w.map((ww, k) => T(x, (i % 2 ? 126 : 62 - (w.length - 1) * 14) + k * 14, ww, 'vz-s', 'middle', 'style="fill:var(--ink);font-weight:600"')).join('')}</g>`; }).join('')}
      ${T(320, 185, 'Public meetings, comment letters, field work and effects analysis at every stage', 'vz-s')}</svg>`; } }
  ];
})();

ROUTES.visuals = function () {
  setCrumb('Motion Visuals');
  const figs = DB.index.ch.flatMap(c => (c.figs || []).map(f => ({ k: f[0], cap: f[1], n: c.n, p: c.p })));
  page(`<span class="eyebrow">Motion visuals</span><h1 style="font-size:28px;margin:6px 0 6px">Concepts that move</h1>
  <p class="muted read">Nine animated explainers of ideas that students find hardest to picture, followed by a moving gallery of the ${figs.length} figures in the textbook.</p>
  <div class="row" style="margin:10px 0"><button class="btn sm ghost" id="vzPause">${ic('pause')} Pause the animations</button><button class="btn sm ghost" id="vzReplay">${ic('redo')} Replay from the start</button></div>
  <div class="vgrid">${VZ.map(v => `<div class="viz"><h3>${esc(v.title)}</h3>${v.svg()}<p>${esc(v.text)} <a href="#ch${v.ch}">Chapter ${v.ch}</a></p></div>`).join('')}</div>
  <h2 class="sec-title">${ic('film')} The textbook figures in motion</h2>
  <div class="row" style="gap:6px;margin-bottom:10px"><button class="chip on" data-gp="0">All Parts</button>${DB.index.parts.map(p => `<button class="chip" data-gp="${p.n}">Part ${p.n}</button>`).join('')}</div>
  <div class="grid g2" style="align-items:start"><div><div class="kb" id="kb"></div><div class="row sp" style="margin-top:8px"><div class="row"><button class="ib" id="kbPrev" aria-label="Previous figure">${ic('left')}</button><button class="ib" id="kbPlay">${ic('pause')} Pause</button><button class="ib" id="kbNext" aria-label="Next figure">${ic('right')}</button></div><span class="muted num" id="kbCount"></span></div></div>
  <div class="card" id="kbInfo"></div></div>`);
  let paused = false;
  const svgs = () => $$('.viz svg');
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { paused = true; svgs().forEach(s => s.pauseAnimations && s.pauseAnimations()); }
  const pb = $('#vzPause'); const lab = () => { pb.innerHTML = paused ? ic('play') + ' Play the animations' : ic('pause') + ' Pause the animations'; }; lab();
  pb.onclick = () => { paused = !paused; svgs().forEach(s => { if (s.pauseAnimations) paused ? s.pauseAnimations() : s.unpauseAnimations(); }); lab(); };
  $('#vzReplay').onclick = () => svgs().forEach(s => { if (s.setCurrentTime) s.setCurrentTime(0); if (s.unpauseAnimations) s.unpauseAnimations(); paused = false; lab(); });
  let list = shuffle(figs), i = 0, play = !paused, tm = null;
  const show = () => { if (!list.length) return; const f = list[i]; $('#kb').innerHTML = `<img src="${imgUrl(f.k)}" alt="${esc(f.cap)}" data-zoom="${esc(f.cap)}" style="cursor:zoom-in">`; $('#kbCount').textContent = `${i + 1} of ${list.length}`; $('#kbInfo').innerHTML = `<span class="eyebrow">Part ${f.p} &middot; Chapter ${f.n}</span><h3 style="font-size:17px;margin:6px 0">${esc(f.cap || 'Figure')}</h3><p class="muted" style="font-size:14px">${esc(chMeta(f.n).ti)}</p><a class="btn sm" href="#ch${f.n}-examples">${ic('right')} See it in Chapter ${f.n}</a>`; };
  const start = () => { clearInterval(tm); if (play) tm = setInterval(() => { if (!$('#kb')) { clearInterval(tm); return; } i = (i + 1) % list.length; show(); }, 8000); $('#kbPlay').innerHTML = play ? ic('pause') + ' Pause' : ic('play') + ' Play'; };
  $('#kbPrev').onclick = () => { i = (i - 1 + list.length) % list.length; show(); start(); };
  $('#kbNext').onclick = () => { i = (i + 1) % list.length; show(); start(); };
  $('#kbPlay').onclick = () => { play = !play; start(); };
  $$('[data-gp]').forEach(b => b.onclick = () => { $$('[data-gp]').forEach(x => x.classList.toggle('on', x === b)); const p = +b.dataset.gp; list = shuffle(figs.filter(f => !p || f.p === p)); i = 0; show(); start(); });
  show(); start();
};

/* ===== boot ===== */
async function boot() {
  try {
    DB.index = await getJSON('data/index.json');
  } catch (e) {
    document.body.innerHTML = `<div style="padding:40px;font-family:sans-serif"><h2>The learning application could not load its content</h2><p>${esc(e.message)}. Please check your connection and reload the page.</p></div>`;
    return;
  }
  renderShell();
  window.addEventListener('hashchange', route);
  await route();
  welcome();
  Store.onSync(changed => { if (changed) { markNav((location.hash || '#home').slice(1)); const h = (location.hash || '#home').slice(1); if (h === 'home' || h === 'progress') route(); } });
  Store.initCloud();
}
boot();
